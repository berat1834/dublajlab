services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      APP_ENV: production
      DATABASE_URL: ${DATABASE_URL:-sqlite:////app/media/dublajlab.db}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set in .env.docker}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-4320}
      MEDIA_ROOT: /app/media
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3000}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      EMAIL_VERIFICATION_REQUIRED: ${EMAIL_VERIFICATION_REQUIRED:-false}
      EMAIL_VERIFICATION_TTL_MINUTES: ${EMAIL_VERIFICATION_TTL_MINUTES:-60}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL:-}
      SMTP_USE_TLS: ${SMTP_USE_TLS:-true}
      SMTP_USE_SSL: ${SMTP_USE_SSL:-false}
      MAINTENANCE_TOKEN: ${MAINTENANCE_TOKEN:?MAINTENANCE_TOKEN must be set in .env.docker}
      PUBLIC_DEMO_MODE: ${PUBLIC_DEMO_MODE:-false}
      DEMO_MAX_FILE_SIZE_MB: ${DEMO_MAX_FILE_SIZE_MB:-20}
      DEMO_MAX_VIDEO_DURATION_SECONDS: ${DEMO_MAX_VIDEO_DURATION_SECONDS:-30}
      DEMO_MAX_RECORDING_SIZE_MB: ${DEMO_MAX_RECORDING_SIZE_MB:-5}
      DEMO_MAX_EXPORTS_PER_IP_PER_DAY: ${DEMO_MAX_EXPORTS_PER_IP_PER_DAY:-5}
      DEMO_MEDIA_TTL_HOURS: ${DEMO_MEDIA_TTL_HOURS:-24}
      TRUST_PROXY_HEADERS: ${TRUST_PROXY_HEADERS:-false}
      LIPSYNC_ENABLED: ${LIPSYNC_ENABLED:-false}
      LIPSYNC_PROVIDER: ${LIPSYNC_PROVIDER:-disabled}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      STORAGE_PROVIDER: ${STORAGE_PROVIDER:-local}
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      S3_BUCKET_NAME: ${S3_BUCKET_NAME:-}
      S3_PUBLIC_BASE_URL: ${S3_PUBLIC_BASE_URL:-}
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - dublajlab_media:/app/media
    init: true
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)"
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000}
        VITE_SHOPIER_VIP_URL: ${VITE_SHOPIER_VIP_URL:-}
        VITE_VIP_PRICE_LABEL: ${VITE_VIP_PRICE_LABEL:-₺199}
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  dublajlab_media:
    name: dublajlab_media
  redis_data:
    name: redis_data
