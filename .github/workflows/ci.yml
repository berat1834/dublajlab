name: CI

on:
  push:
    branches: [main, dev, Berat]
  pull_request:
    branches: [main, dev]

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install FFmpeg
        continue-on-error: true
        run: |
          timeout 120s sudo apt-get update \
            -o Acquire::Retries=2 \
            -o Acquire::http::Timeout=20 \
            -o Acquire::https::Timeout=20
          timeout 120s sudo apt-get install --yes --no-install-recommends ffmpeg

      - name: Install dependencies
        run: python -m pip install --requirement backend/requirements-dev.txt

      - name: Run backend tests
        run: python -m pytest backend/tests -q

  frontend:
    name: Frontend quality
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

